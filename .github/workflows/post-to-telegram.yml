name: Post new Substack entries to Telegram

on:
  schedule:
    # Mỗi 30 phút. Cron của GitHub hay trễ vài phút khi hệ thống bận,
    # muốn đăng ngay lúc vừa publish thì bấm Run workflow ở tab Actions.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ in ra log, không gửi Telegram"
        type: boolean
        default: false
      send_latest:
        description: "Gửi thử bài mới nhất, không ghi state"
        type: boolean
        default: false

# Cần quyền ghi để commit lại state/posted.json sau khi đăng.
permissions:
  contents: write

concurrency:
  group: post-to-telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check feed and post
        env:
          SUBSTACK_PUBLICATION: ${{ vars.SUBSTACK_PUBLICATION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE_FOOTER: ${{ vars.MESSAGE_FOOTER }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SEND_LATEST: ${{ inputs.send_latest && '1' || '0' }}
        run: bun src/main.ts

      # Cron chạy 48 lần/ngày, hỏng một cái là hỏng cả ngày. Chỉ báo ở lần
      # fail đầu tiên sau một lần chạy thành công, để không bị dội 48 tin.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_CHAT_ID" ]; then
            echo "Chưa set TELEGRAM_ALERT_CHAT_ID, bỏ qua cảnh báo."
            exit 0
          fi

          previous=$(gh run list --workflow=post-to-telegram.yml --limit 2 \
            --json databaseId,conclusion \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})][0].conclusion" || echo "")
          if [ "$previous" = "failure" ]; then
            echo "Lần chạy trước cũng fail, đã báo rồi, bỏ qua."
            exit 0
          fi

          curl -sS -X POST "https://api.telegram.org/bot${ALERT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ALERT_CHAT_ID}" \
            --data-urlencode "text=substack-to-telegram vừa fail. Bài mới (nếu có) chưa được đăng. Log: ${RUN_URL}" \
            --data-urlencode "link_preview_options={\"is_disabled\":true}" \
            -o /dev/null -w "Đã gửi cảnh báo, HTTP %{http_code}\n"

      - name: Commit state
        run: |
          if git diff --quiet -- state/posted.json; then
            echo "State không đổi, bỏ qua commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git commit -m "chore(state): record posted entries"
          git push
